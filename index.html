<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Christian Shema — Full-Stack Developer</title>
    <meta
      name="description"
      content="Christian Shema is a full-stack developer specializing in React, Node.js, AI integrations, and scalable web systems. Available for projects."
    />
    <meta name="author" content="Christian Shema" />
    <meta
      name="keywords"
      content="Christian Shema, developer, full-stack, React, Node.js, AI, web development, Rwanda, portfolio"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Christian Shema — Full-Stack Developer"
    />
    <meta
      property="og:description"
      content="Precision engineering for the modern web. React, Node.js, AI integrations, and high-performing digital systems."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:url" content="https://christian-shema-dev.replit.app" />
    <meta property="og:site_name" content="Christian Shema Portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Christian Shema — Full-Stack Developer"
    />
    <meta
      name="twitter:description"
      content="Precision engineering for the modern web. React, Node.js, AI integrations."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#070d1b" />
    <meta name="color-scheme" content="dark" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Prevent flash of unstyled content */
      html {
        background: #070d1b;
      }
      body {
        margin: 0;
        padding-bottom: 50px;
        background: #070d1b;
      }
      * {
        box-sizing: border-box;
      }

      /* Fixed Bottom Marquee Styling */
      .marquee-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        background-color: #0f172a;
        color: #38bdf8;
        padding: 12px 0;
        font-family: "Poppins", sans-serif;
        font-weight: bold;
        font-size: 1.2rem;
        z-index: 9999;
        border-top: 1px solid #1e293b;
      }

      .marquee-text {
        display: inline-block;
        padding-left: 100%;
        animation: marquee 10s linear infinite;
      }

      @keyframes marquee {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(-100%, 0);
        }
      }
    </style>
  </head>
  <body>
    <!-- React App Root Container -->
    <div id="root"></div>

    <!-- Fixed Bottom Marquee Animation -->
    <div class="marquee-container">
      <div class="marquee-text">
        Software Development Real Life 🚀 &nbsp;&nbsp;&nbsp;&nbsp; Software
        Development Real Life 💻 &nbsp;&nbsp;&nbsp;&nbsp;
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
